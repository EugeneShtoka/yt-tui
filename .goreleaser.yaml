# GoReleaser configuration for yt-tui.
#
# Local dry run (no tag needed):  goreleaser release --snapshot --clean --skip=sign,sbom
#                                 (the skip spares installing cosign and syft)
# Real release:                   git tag v0.1.0 && git push origin v0.1.0
#                                 (the release workflow runs GoReleaser)
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: yt-tui
    main: ./cmd/yt-tui
    binary: yt-tui
    env:
      - CGO_ENABLED=0 # modernc.org/sqlite is pure Go — no cgo needed.
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/EugeneShtoka/yt-tui/internal/buildinfo.Version={{.Version}}
      - -X github.com/EugeneShtoka/yt-tui/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/EugeneShtoka/yt-tui/internal/buildinfo.Date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  - id: yt-tuid
    main: ./cmd/yt-tuid
    binary: yt-tuid
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/EugeneShtoka/yt-tui/internal/buildinfo.Version={{.Version}}
      - -X github.com/EugeneShtoka/yt-tui/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/EugeneShtoka/yt-tui/internal/buildinfo.Date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  # One archive per platform containing both binaries plus docs.
  - id: default
    ids: [yt-tui, yt-tuid]
    name_template: >-
      yt-tui_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - ARCHITECTURE.md
      - deploy/yt-tuid.service

checksum:
  name_template: checksums.txt

# One SBOM per archive, generated by syft (the release job installs it).
#
# checksums.txt answers "is this the file that was published"; it says nothing about
# what is *in* it. For a client that reads your browser's YouTube cookies and a daemon
# that holds a bearer token — the areas SECURITY.md flags — the question a downstream
# packager or a security scanner actually asks is which dependencies are inside, and
# at which versions. That is what this answers, and it is answered from the build
# rather than reconstructed from go.mod afterwards.
sboms:
  - artifacts: archive

# A keyless signature over the checksum file, which covers every artifact it lists.
#
# Keyless (Sigstore/Fulcio) rather than a long-lived key, because a signing key that
# lives in a repository secret is a key whose compromise is silent and whose rotation
# is a manual job nobody remembers. An ambient OIDC identity is issued to this workflow
# for the length of one run, and the certificate records *which workflow, at which
# commit* asked for it — which is the fact a verifier wants anyway.
#
# COSIGN_EXPERIMENTAL is not set: keyless is the default in cosign v2+. Cosign v3
# writes certificate and signature together as one Sigstore bundle (--bundle), so the
# release carries checksums.txt.sigstore.json instead of a .sig and a .pem.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  # Group the auto-generated changelog by conventional-commit prefix; drop noise.
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  draft: false
  prerelease: auto # tags like v0.1.0-rc1 are marked prerelease automatically.
  footer: |
    ---
    **Install:** download the archive for your platform, extract, and put
    `yt-tui` (and optionally `yt-tuid`) on your `PATH`. Requires `yt-dlp` and a
    media player (`mpv`/`vlc`). See the README for details.

    **Verify what you downloaded.** Every archive carries a build attestation and
    `checksums.txt` is signed keylessly with Sigstore; an SBOM (`*.sbom.json`) ships
    beside each archive. See SECURITY.md for the commands.
