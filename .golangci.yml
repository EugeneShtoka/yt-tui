version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    # Architecture
    - depguard       # enforce layer boundaries (see rules below)
    # Bugs
    - govet          # shadow + copylocks + printf consistency
    - staticcheck    # industry-leading bug + performance checker
    - errcheck       # every error must be handled
    - nilerr         # don't return nil when wrapping a non-nil error
    - noctx          # http requests must carry a context
    - wrapcheck      # errors from external packages must be wrapped with context
    # api/inproc.go is exempted via file-level nolint (pass-through adapter by design).
    # Code quality
    - gocritic       # diagnostic + style + performance
    - unconvert      # remove redundant type conversions
    - misspell       # catch common typos in comments and strings
    - unused         # dead code detection
    - bodyclose      # HTTP response bodies must be closed
    - ineffassign    # detect ineffective assignments
    # Security
    - gosec          # security checks (G202/G204/G304/G104 excluded below)
    - funlen
    - gocognit
    # Adopted from mx-tui.
    - errorlint      # errors.Is/As over == and type assertions on wrapped errors
    - sqlclosecheck  # rows/stmts closed with defer
    - rowserrcheck   # rows.Err checked after iteration
    - containedctx   # a context held in a struct must be a decision, not a habit
    - nolintlint     # every suppression names its linter and says why
    - exhaustive     # a switch over an enum names every value, or says why not
    - bidichk        # no invisible direction controls in source
    - protogetter    # read wire messages through their nil-safe getters
    - usestdlibvars  # http.MethodGet, not "GET"
    - modernize      # the current idiom (range over int, slices/maps helpers, min/max)
    - unparam        # a parameter every caller passes the same value, or a result nobody reads
    - sloglint       # slog calls: key/value pairs consistent
    - durationcheck  # two durations multiplied (a unit error)
    - errchkjson     # a json encode error that can happen is checked
    - usetesting     # t.TempDir / t.Context / t.Setenv over the os and context versions
    # Considered and left off: contextcheck flags the deliberately detached contexts
    # (the position tracker, background enrichment), and nilnil the "found nothing"
    # (nil, nil) returns that are the documented contract of their functions.

  settings:
    exhaustive:
      default-signifies-exhaustive: true
      ignore-enum-types: "reflect\\.Kind"

    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

    gocognit:
      min-complexity: 25

    govet:
      enable:
        - shadow     # catch variable shadowing — footgun in bubbletea update loops
        - copylocks  # detect mutex copied by value

    depguard:
      rules:
        # Foundation packages are import sinks — nothing internal flows in.
        foundation-no-internal:
          files:
            - "**/internal/config/**"
            - "**/internal/debug/**"
            - "**/internal/sys/**"
            - "**/internal/theme/**"
          deny:
            - pkg: "github.com/EugeneShtoka/yt-tui/internal"
              desc: "foundation packages must not import other internal packages"

        # Domain is pure business logic — no infrastructure, no I/O.
        domain-no-infra:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/db"
              desc: "domain must not import db"
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/youtube"
              desc: "domain must not import youtube (infrastructure adapter)"
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/api"
              desc: "domain must not import api"
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/downloader"
              desc: "domain must not import downloader"
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/player"
              desc: "domain must not import player"
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/backend"
              desc: "domain must not import backend"
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/tui"
              desc: "domain must not import tui"

        # Backend/service is the application service layer — orchestrates domain,
        # but must not reach into infrastructure or presentation directly.
        backend-no-infra:
          files:
            - "**/internal/backend/**"
            # transport is the Connect adapter layer: it wraps api.Backend into
            # gRPC/Connect handlers and must import both backend and api by design.
            - "!**/internal/backend/transport/**"
            # media serves downloaded files; imports api.Backend via LocalVideoStore.
            - "!**/internal/backend/media/**"
          deny:
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/db"
              desc: "backend must not import db directly; inject via interface"
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/youtube"
              desc: "backend must not import youtube directly; inject via interface"
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/downloader"
              desc: "backend must not import downloader directly; inject via interface"
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/tui"
              desc: "backend must not import tui"
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/api"
              desc: "backend must not import api"

        # Infrastructure packages must not import Bubble Tea.
        # internal/youtube is excluded: it still returns tea.Cmd helpers that need
        # to be migrated to the TUI layer (tracked in the audit as a future item).
        no-bubbletea-in-infra:
          files:
            - "**/internal/downloader/**"
            - "**/internal/db/**"
            - "**/internal/domain/**"
            - "**/internal/backend/**"
            - "**/internal/device/**"
          deny:
            - pkg: "charm.land/bubbletea"
              desc: "infrastructure packages must not import bubbletea; keep the TUI framework in internal/tui"

        # TUI is the presentation layer — it talks to the world through api,
        # never by reaching into infrastructure packages directly.
        tui-no-infra:
          files:
            - "**/internal/tui/**"
          deny:
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/db"
              desc: "tui must not import db; use api/backend"
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/youtube"
              desc: "tui must not import youtube; use api/backend"
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/downloader"
              desc: "tui must not import downloader directly; use api/backend"
            - pkg: "github.com/EugeneShtoka/yt-tui/internal/backend"
              desc: "tui must not import backend/service directly; use api interface"

        # ── Allow-lists (from mx-tui): each names exactly what its package may import,
        # so a new dependency must be written down here. scripts/depguard-coverage-check.sh
        # fails on a package no rule names.
        buildinfo-is-standalone:
          files:
            - "**/internal/buildinfo/**"
          allow:
            - "$gostd"
        text-is-a-leaf:
          files:
            - "**/internal/text/**"
          allow:
            - "$gostd"
        procexec-is-a-leaf:
          files:
            - "**/internal/procexec/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/yt-tui/internal/procexec"

        # The yt-dlp adapter: config, domain types and the process runner only.
        youtube-is-the-adapter:
          files:
            - "**/internal/youtube/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/yt-tui/internal/config"
            - "github.com/EugeneShtoka/yt-tui/internal/debug"
            - "github.com/EugeneShtoka/yt-tui/internal/domain"
            - "github.com/EugeneShtoka/yt-tui/internal/procexec"
            - "github.com/EugeneShtoka/yt-tui/internal/text"
            - "github.com/EugeneShtoka/yt-tui/internal/youtube"

        # The generated wire types: protobuf and connect only.
        wire-is-generated:
          files:
            - "**/internal/api/backend/v1/*.go"
            - "**/internal/api/backend/v1/backendv1connect/**"
          allow:
            - "$gostd"
            - "google.golang.org/protobuf"
            - "connectrpc.com/connect"
            - "github.com/EugeneShtoka/yt-tui/internal/api/backend/v1"

        # Wire <-> domain mapping; no infrastructure.
        protoconv-maps-wire-to-domain:
          files:
            - "**/internal/api/backend/v1/protoconv/**"
          allow:
            - "$gostd"
            - "google.golang.org/protobuf"
            - "github.com/EugeneShtoka/yt-tui/internal/api/backend/v1"
            - "github.com/EugeneShtoka/yt-tui/internal/domain"

        # The backend seam: InProc wires the daemon-side services, Remote the wire.
        # Never the TUI.
        api-is-the-seam:
          files:
            - "**/internal/api/*.go"
            - "!$test"
          allow:
            - "$gostd"
            - "connectrpc.com/connect"
            - "golang.org/x/sync"
            - "github.com/EugeneShtoka/yt-tui/internal/api"
            - "github.com/EugeneShtoka/yt-tui/internal/backend"
            - "github.com/EugeneShtoka/yt-tui/internal/config"
            - "github.com/EugeneShtoka/yt-tui/internal/db"
            - "github.com/EugeneShtoka/yt-tui/internal/debug"
            - "github.com/EugeneShtoka/yt-tui/internal/domain"
            - "github.com/EugeneShtoka/yt-tui/internal/downloader"
            - "github.com/EugeneShtoka/yt-tui/internal/youtube"

        # Test fakes: the seam's types and nothing behind them.
        fakes-are-sinks:
          files:
            - "**/internal/api/apitest/**"
            - "**/internal/procexec/procexectest/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/yt-tui/internal/api"
            - "github.com/EugeneShtoka/yt-tui/internal/config"
            - "github.com/EugeneShtoka/yt-tui/internal/domain"
            - "github.com/EugeneShtoka/yt-tui/internal/procexec"

        # Background thumbnail warming for the client: through the seam only.
        prewarm-uses-the-seam:
          files:
            - "**/internal/prewarm/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/yt-tui/internal/api"
            - "github.com/EugeneShtoka/yt-tui/internal/debug"

        # The binaries. yt-tui is the single-binary mode, so it wires the in-process
        # backend (db, downloader, youtube) as well as the TUI.
        client-main-wiring:
          files:
            - "**/cmd/yt-tui/**"
          allow:
            - "$gostd"
            - "charm.land/bubbletea/v2"
            - "github.com/charmbracelet/x/term"
            - "github.com/EugeneShtoka/yt-tui/internal/api"
            - "github.com/EugeneShtoka/yt-tui/internal/backend/thumbs"
            - "github.com/EugeneShtoka/yt-tui/internal/backend/transcache"
            - "github.com/EugeneShtoka/yt-tui/internal/buildinfo"
            - "github.com/EugeneShtoka/yt-tui/internal/config"
            - "github.com/EugeneShtoka/yt-tui/internal/db"
            - "github.com/EugeneShtoka/yt-tui/internal/debug"
            - "github.com/EugeneShtoka/yt-tui/internal/device/player"
            - "github.com/EugeneShtoka/yt-tui/internal/downloader"
            - "github.com/EugeneShtoka/yt-tui/internal/prewarm"
            - "github.com/EugeneShtoka/yt-tui/internal/theme"
            - "github.com/EugeneShtoka/yt-tui/internal/tui"
            - "github.com/EugeneShtoka/yt-tui/internal/youtube"

        # The daemon is headless: nothing under internal/tui, no bubbletea.
        daemon-main-wiring:
          files:
            - "**/cmd/yt-tuid/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/yt-tui/internal/api"
            - "github.com/EugeneShtoka/yt-tui/internal/backend"
            - "github.com/EugeneShtoka/yt-tui/internal/buildinfo"
            - "github.com/EugeneShtoka/yt-tui/internal/config"
            - "github.com/EugeneShtoka/yt-tui/internal/db"
            - "github.com/EugeneShtoka/yt-tui/internal/downloader"
            - "github.com/EugeneShtoka/yt-tui/internal/youtube"

    errcheck:
      # Defer Close/Rollback are intentionally fire-and-forget cleanup paths.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (io.Closer).Close
        - (*os.File).Close

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      # style tag produces too much churn; re-enable when the codebase stabilises.
      disabled-checks:
        - hugeParam          # bubbletea models are legitimately large value types

    wrapcheck:
      # sql.Rows.Scan errors are returned unwrapped by the queryList/queryMap scan
      # closures (and the scanVideo/scanChannel helpers); every DB method wraps them
      # with its own "Name: %w" context at the call site. Add .Scan( to the ignore
      # list so that convention needs no //nolint on every scan closure. Setting
      # ignoreSigs replaces the defaults, so the default entries are re-listed here.
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - .Scan(

    misspell:
      locale: US

    gosec:
      excludes:
        - G202  # SQL concat: structure/placeholders only, not user input
        - G204  # subprocess: intentional tool launching (yt-dlp, mpv, editor)
        - G304  # file include: legitimate config/debug file path ops
        - G703  # path traversal (taint): the --config/data_dir paths are user-supplied by design
        - G104  # unhandled errors: covered by errcheck exclusions (Close/Rollback)

    funlen:
      # Code lines only; comments are not counted.
      ignore-comments: true
      lines: 60        # 60 lines of code
      statements: 40   # or 40 statements, whichever comes first

  # v2 moved issue exclusions under linters.exclusions (was issues.exclude-rules).
  exclusions:
    # Generated protobuf files are excluded from every linter.
    paths:
      - "\\.pb\\.go"
    rules:
      # Test files: relax dead-code and security rules, plus two linters that are
      # noise in tests — wrapcheck (returning a raw error from a table-driven
      # closure needs no wrapping) and funlen (data tables are legitimately long).
      - path: "_test\\.go"
        linters:
          - unused
          - gosec
          - wrapcheck
          - funlen
          - gocognit
          - containedctx
          # A test helper keeps a parameter every caller passes alike when naming it at
          # the call site says what the test is about.
          - unparam
      # Every TUI handler returns (Model, tea.Cmd) so dispatch treats them alike; one
      # that has no command yet answers nil rather than a different shape.
      - linters: [unparam]
        text: "result 1 \\(charm\\.land/bubbletea/v2\\.Cmd\\) is always nil"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
