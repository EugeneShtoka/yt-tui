name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Every CI gate, on the tagged commit, before anything is published.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags for the changelog.
          persist-credentials: false

      # A tag pushed from a branch would otherwise release code main never had.
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # goreleaser at tools/versions.env's version and checksum (the one `make
      # release-check` validates the config with), and go.mod's toolchain.
      - name: Pinned tool versions
        run: |
          set -euo pipefail
          echo "GOTOOLCHAIN=$(awk '$1 == "toolchain" {print $2}' go.mod)" >> "$GITHUB_ENV"
          bash scripts/ensure-tools.sh goreleaser
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
