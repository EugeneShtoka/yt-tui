name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Every CI gate, on the tagged commit, before anything is published.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    # Protection rules (required reviewers, tag patterns) are set on the environment in
    # the repository settings.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release and upload its assets
      # Sigstore keyless signing and build attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags for the changelog.
          persist-credentials: false

      # A tag pushed from a branch would otherwise release code main never had.
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # goreleaser at tools/versions.env's version and checksum (the one `make
      # release-check` validates the config with), and go.mod's toolchain. syft's and
      # cosign's versions go to $GITHUB_ENV for their installers below.
      - name: Pinned tool versions
        run: |
          set -euo pipefail
          grep -E '^(SYFT|COSIGN)_VERSION=[0-9.]+$' tools/versions.env >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=$(awk '$1 == "toolchain" {print $2}' go.mod)" >> "$GITHUB_ENV"
          bash scripts/ensure-tools.sh goreleaser
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      # GoReleaser shells out to syft (SBOMs) and cosign (signing).
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: "v${{ env.SYFT_VERSION }}"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # v3 signs with --bundle; see signs in .goreleaser.yaml.
          cosign-release: "v${{ env.COSIGN_VERSION }}"

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Verify with: gh attestation verify <file> --repo EugeneShtoka/yt-tui
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.sbom.json
