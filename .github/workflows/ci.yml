name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets release.yml run these same gates on the tagged commit.
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs, except on tags (the release depends on them).
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Every step below is a make target, so the gates, their tools and the Go toolchain
  # (go.mod's `toolchain`, which the Makefile pins) are the same here and in `make
  # check`. scripts/ci-parity-check.sh (the ci-parity gate) holds the two lists equal.
  #
  # ci-ok (at the end) is the single required status check on main: a new gate job
  # must be added to its `needs`, or branch protection will not wait for it.

  # Whether a pull request changes docs alone (scripts/docs-only.sh). Then the docs and
  # secrets gates run and the others skip themselves, which ci-ok accepts for such a PR
  # only. Pushes to main and the release's run (workflow_call) run every gate.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: A pull request of docs alone?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "$EVENT" = pull_request ] && git diff --name-only "$BASE...$HEAD" | bash scripts/docs-only.sh; then
            docs_only=true
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Before the build, so an untidy go.mod fails here and not at release time.
      - name: Modules are tidy and verified, and every package builds as released
        run: make mod-check compile

      # Race detector, coverage profile and the coverage floors (with a summary).
      - name: Test and coverage gate
        run: make coverage-check COVERPROFILE=coverage.out

  # Compile-only, one release platform per leg (linux/amd64 is build-and-test's).
  cross-compile:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          CROSS_TARGETS: ${{ matrix.goos }}/${{ matrix.goarch }}
        run: make cross

  # Repo guards: pins, the layer map, and this file against `make check`.
  repo-checks:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Actions SHA pins, layering, CI parity, the gate scripts' tests
        run: make pin-check arch-check ci-parity script-check

  # Validates .goreleaser.yaml without building, with the release's goreleaser.
  release-config:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: goreleaser check
        run: make release-check

  # golangci-lint is pinned by the go.mod tool directive.
  lint:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint and format check (gofmt/goimports)
        run: make lint fmt-check

  # govulncheck is a go.mod tool; npm audit covers markdownlint's lock.
  vuln:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # markdownlint and npm audit run on node: pinned, as every other tool is.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Vulnerability scan
        run: make vuln

  # The CLI at tools/versions.env's version and checksum, not gitleaks-action: the
  # action's PR-commit API call 403s on fork and Dependabot PRs.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so gitleaks scans every commit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # History (needs fetch-depth: 0) and working tree cover disjoint ground.
      # CHECK_STRICT: a missing history is a failure here, never a skip.
      - name: Scan history and working tree
        run: make secrets CHECK_STRICT=1

  # Generated wire types must match api/proto (buf at tools/versions.env's version).
  proto:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Lints, generates into a scratch dir and compares file by file, so a new
      # (untracked) generated file fails it too.
      - name: Schema lints and generated code is in sync with api/proto
        run: make proto-check

  # markdownlint-cli2 from tools/markdownlint's lock.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Lint Markdown
        run: make docs-check

  # The single required check for branch protection: it covers every gate above.
  ci-ok:
    # always(): a skipped required check counts as passed on GitHub.
    if: always()
    needs: [changes, build-and-test, cross-compile, repo-checks, release-config, lint, vuln, secrets, proto, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          set -euo pipefail
          results="$RESULTS"
          echo "gate results: $results (docs only: $DOCS_ONLY)"
          for r in $results; do
            # A gate skips itself only for a pull request of docs alone (changes).
            if [ "$r" = "skipped" ] && [ "$DOCS_ONLY" = "true" ]; then
              continue
            fi
            if [ "$r" != "success" ]; then
              echo "::error::a required gate did not pass ($results)"
              exit 1
            fi
          done
          echo "all gates green"
